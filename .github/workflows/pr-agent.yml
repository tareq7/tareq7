          openai.key: ${{ secrets.DASHSCOPE_API_KEY }}
          openai.api_base: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          config.model: "openai/qwen3-coder-480b-a35b-instruct"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1000000"
