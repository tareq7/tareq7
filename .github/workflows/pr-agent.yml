name: Multi-Agent PR Review Swarm

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude_opus_reviewer:
    name: "🤖 Claude Opus 5"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run Claude Opus 5 Reviewer
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
          OPENAI_API_BASE: "https://agentrouter-proxy.najetareqz.workers.dev/v1"
          openai.key: ${{ secrets.AGENTROUTER_API_KEY }}
          openai.api_base: "https://agentrouter-proxy.najetareqz.workers.dev/v1"
          config.model: "openai/claude-opus-5"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.review_heading: "🤖 Claude Opus 5 Reviewer"
          pr_reviewer.persistent_comment: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

  alibaba_coder_480b_reviewer:
    name: "🤖 Alibaba Qwen-3 Coder 480B"
