name: Multi-Agent PR Review Swarm

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gemini_reviewer:
    name: "🤖 Gemini 3.8 Flash"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run Gemini Reviewer (Primary)
        id: gemini_primary
        continue-on-error: true
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.7-flash", "gemini/gemini-2.5-flash"]'
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.review_heading: "🤖 Gemini 3.8 Flash Reviewer"
          pr_reviewer.persistent_comment: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

      - name: Run Gemini Reviewer (Account 2 Failover)
        if: steps.gemini_primary.outcome == 'failure'
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.7-flash", "gemini/gemini-2.5-flash"]'
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.review_heading: "🤖 Gemini 3.8 Flash Reviewer"
          pr_reviewer.persistent_comment: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

  byteplus_deepseek_reviewer:
    name: "🤖 BytePlus DeepSeek-V4"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run BytePlus DeepSeek Reviewer
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.ARK_API_KEY }}
          OPENAI_API_BASE: "https://ark.ap-southeast.bytepluses.com/api/v3"
          openai.key: ${{ secrets.ARK_API_KEY }}
          openai.api_base: "https://ark.ap-southeast.bytepluses.com/api/v3"
          config.model: "openai/deepseek-v4-pro-ga-260813"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.review_heading: "🤖 BytePlus DeepSeek-V4 Reviewer"
          pr_reviewer.persistent_comment: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

  alibaba_qwen_reviewer:
    name: "🤖 Alibaba Qwen-3.8-Max"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run Alibaba Qwen Reviewer
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_BASE: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          openai.key: ${{ secrets.DASHSCOPE_API_KEY }}
          openai.api_base: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          config.model: "openai/qwen3.8-max"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.review_heading: "🤖 Alibaba Qwen-3.8-Max Reviewer"
          pr_reviewer.persistent_comment: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

  alibaba_deepseek_reviewer:
    name: "🤖 Alibaba DeepSeek-V4"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run Alibaba DeepSeek Reviewer
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_BASE: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          openai.key: ${{ secrets.DASHSCOPE_API_KEY }}
          openai.api_base: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          config.model: "openai/deepseek-v4-pro"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.review_heading: "🤖 Alibaba DeepSeek-V4 Reviewer"
          pr_reviewer.persistent_comment: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

  alibaba_coder_reviewer:
    name: "🤖 Alibaba Qwen-3-Coder"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run Alibaba Qwen-3-Coder Reviewer
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_BASE: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          openai.key: ${{ secrets.DASHSCOPE_API_KEY }}
          openai.api_base: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          config.model: "openai/qwen3-coder-plus"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.review_heading: "🤖 Alibaba Qwen-3-Coder Reviewer"
          pr_reviewer.persistent_comment: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

  agentrouter_glm_reviewer:
    name: "🤖 AgentRouter GLM-5.3"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run AgentRouter GLM-5.3 Reviewer
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
          OPENAI_API_BASE: "https://agentrouter-proxy.najetareqz.workers.dev/v1"
          openai.key: ${{ secrets.AGENTROUTER_API_KEY }}
          openai.api_base: "https://agentrouter-proxy.najetareqz.workers.dev/v1"
          config.model: "openai/glm-5.3"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.review_heading: "🤖 AgentRouter GLM-5.3 Reviewer"
          pr_reviewer.persistent_comment: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
