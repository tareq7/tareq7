name: Multi-Agent PR Review Swarm

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

env:
  config.max_model_tokens: "250000"
  config.custom_model_max_tokens: "250000"
  pr_reviewer.enable_large_pr_chunking: "true"
  pr_reviewer.max_number_of_calls: "5"

jobs:
  gemini_reviewer:
    name: "🤖 Gemini 3.8 Flash"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run Gemini Reviewer (Primary)
        id: gemini_primary
        continue-on-error: true
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.7-flash", "gemini/gemini-2.5-flash"]'
          config.max_model_tokens: "1000000"
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.enable_large_pr_chunking: "true"
          pr_reviewer.max_number_of_calls: "5"
          pr_reviewer.review_heading: "🤖 Gemini 3.8 Flash Reviewer"
          pr_reviewer.persistent_comment: "false"
          pr_reviewer.publish_error_details: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

      - name: Run Gemini Reviewer (Account 2 Failover)
        if: steps.gemini_primary.outcome == 'failure'
        continue-on-error: true
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.7-flash", "gemini/gemini-2.5-flash"]'
          config.max_model_tokens: "1000000"
          config.custom_model_max_tokens: "1000000"
          pr_reviewer.enable_large_pr_chunking: "true"
          pr_reviewer.max_number_of_calls: "5"
          pr_reviewer.review_heading: "🤖 Gemini 3.8 Flash Reviewer"
          pr_reviewer.persistent_comment: "false"
          pr_reviewer.publish_error_details: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

