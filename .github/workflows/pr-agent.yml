name: Multi-Agent PR Review Swarm

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

env:
  config.max_model_tokens: "128000"
  config.custom_model_max_tokens: "128000"
  pr_reviewer.enable_large_pr_chunking: "true"
  pr_reviewer.max_number_of_calls: "5"

jobs:
  agentrouter_deepseek_flash_reviewer:
    name: "🤖 AgentRouter DeepSeek V4 Flash"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run AgentRouter DeepSeek V4 Flash Reviewer
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
          OPENAI_API_BASE: "https://agentrouter-proxy.najetareqz.workers.dev/v1"
          openai.key: ${{ secrets.AGENTROUTER_API_KEY }}
          openai.api_base: "https://agentrouter-proxy.najetareqz.workers.dev/v1"
          config.model: "openai/deepseek-v4-flash"
          config.fallback_models: "[]"
          config.max_model_tokens: "128000"
          config.custom_model_max_tokens: "128000"
          pr_reviewer.enable_large_pr_chunking: "true"
          pr_reviewer.max_number_of_calls: "5"
          pr_reviewer.review_heading: "🤖 AgentRouter DeepSeek V4 Flash Reviewer"
          pr_reviewer.persistent_comment: "false"
          pr_reviewer.publish_error_details: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
